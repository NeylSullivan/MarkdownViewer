name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test Windows release
    runs-on: windows-2025
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release version
        id: version
        run: |
          . ./scripts/ReleaseVersion.ps1
          $version = $env:GITHUB_REF_NAME.Substring(1)
          Assert-ReleaseVersion -Version $version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: ga

      - name: Build and run smoke tests
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build.ps1 -RunTests -Version $env:RELEASE_VERSION

      - name: Package release and checksum
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/publish.ps1 -Version $env:RELEASE_VERSION

      - name: Save release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            artifacts/MarkdownViewer-${{ steps.version.outputs.version }}-win-x64-framework-dependent.zip
            artifacts/MarkdownViewer-${{ steps.version.outputs.version }}-win-x64-framework-dependent.zip.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Save smoke test screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-test-screenshots
          path: artifacts/qa/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}

    steps:
      - name: Download tested release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: artifacts

      - name: Verify archive checksum
        working-directory: artifacts
        run: sha256sum --check "MarkdownViewer-${RELEASE_VERSION}-win-x64-framework-dependent.zip.sha256"

      - name: Create and publish release
        shell: bash
        run: |
          set -euo pipefail
          archive="artifacts/MarkdownViewer-${RELEASE_VERSION}-win-x64-framework-dependent.zip"
          draft=$(gh api --paginate "repos/${GH_REPO}/releases" \
            --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .draft')

          if [[ "$draft" == 'false' ]]; then
            echo "Release ${RELEASE_TAG} is already published; leaving it unchanged."
            exit 0
          fi

          flags=(--prerelease=false)
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi

          if [[ "$draft" != 'true' ]]; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Markdown Viewer ${RELEASE_VERSION}" --generate-notes \
              --notes 'Windows x64 build. Requires Microsoft .NET Desktop Runtime 10 (x64). Extract the ZIP and run MarkdownViewer.exe.' \
              "${flags[@]}"
          fi

          gh release upload "$RELEASE_TAG" "$archive" "${archive}.sha256" --clobber
          gh release edit "$RELEASE_TAG" --draft=false "${flags[@]}"
